services:

  app:
    build:
      context: .  # El dockerfile con las instrucciones para construir este contenedor esta en el mismo directorio
    
    container_name: issueflow_app #nombre del contenedor

    ports:
      - "8000:80" # 8000 es el puerto del ordenador host, y 80 el interno del contenedor

    environment:
      - .env

    command: 
      - sh
      - -c
      - >-
        php bin/console doctrine:migrations:migrate --no-interaction &&
        php bin/console app:tickets:seed --no-interaction &&
        apache2-foregro
      

    depends_on:
      db:
        condition: service_healthy
  
  db:
    image: mysql:8.4 #Usa la imagen oficial de MySQL 8-4, que a diferencia de app aqui no se construye  una imagen

    container_name: issueflow_db

    environment:
      MYSQL_DATABASE: issueflow
      MYSQL_USER: issueflow
      MYSQL_PASSWORD: issueflow_pass
      MYSQL_ROOT_PASSWORD: root_pass
    
    ports: 
      - "3307:3306"
    
    volumes:
      - mysql_data:/var/lib/mysql #Guarda los archivos de mySQL en un volumen persistente
    
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  
volumes:
  mysql_data:
